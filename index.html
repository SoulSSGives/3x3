<style>
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden}
:root{--vw:1vw}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:#E6E8EB;font-family:'Archivo',system-ui,sans-serif;font-weight:500;color:#0D0D0D;overflow-x:hidden;max-width:calc(100 * var(--vw,1vw))}
button,input{font:inherit;color:inherit}
.bg{background:radial-gradient(ellipse at 50% 30%,#FFFFFF 0%,#E6E8EB 52%,#CDD1D6 100%);min-height:var(--vh,100vh)}
.wrap{width:100%;max-width:1280px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.lab{font-family:'Unbounded',sans-serif;font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.unb{font-family:'Unbounded',sans-serif}
.plain{all:unset;box-sizing:border-box;cursor:pointer;display:block}
.pill{cursor:pointer;font-family:'Unbounded',sans-serif;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;min-height:48px;padding:0 30px;border-radius:999px;border:2px solid #0D0D0D;background:transparent;color:#0D0D0D;transition:transform .22s cubic-bezier(.3,1.6,.5,1),background .2s,color .2s}
.pill:hover{background:#0D0D0D;color:#F6F6F4;transform:translateY(-3px) scale(1.04)}
.pill:active{transform:scale(.96)}
.pill-solid{background:#0D0D0D;color:#F6F6F4}
.pill-solid:hover{background:#F6F6F4;color:#0D0D0D}
.size{cursor:pointer;font-family:'Unbounded',sans-serif;font-weight:700;font-size:12px;min-width:48px;min-height:48px;border-radius:999px;border:2px solid #0D0D0D;color:#0D0D0D;background:transparent;transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s}
.size:hover{background:#D9DCE0;transform:translateY(-3px) scale(1.1)}
.size[aria-pressed="true"]{background:#0D0D0D;color:#F6F6F4}
.qty{cursor:pointer;font-family:'Unbounded',sans-serif;font-weight:700;font-size:16px;width:40px;height:40px;padding:0;border-radius:999px;border:2px solid #0D0D0D;background:transparent;color:#0D0D0D;transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s}
.qty:hover{background:#0D0D0D;color:#F6F6F4;transform:scale(1.15)}
.input{width:100%;min-width:0;min-height:48px;padding:0 16px;font-family:'Unbounded',sans-serif;font-weight:500;font-size:14px;border:2px solid #0D0D0D;border-radius:14px;background:#F6F6F4;color:#0D0D0D;transition:box-shadow .2s,transform .2s cubic-bezier(.3,1.6,.5,1)}
.input:focus{outline:none;box-shadow:0 0 0 4px rgba(13,13,13,.14);transform:translateY(-2px)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #0D0D0D;outline-offset:3px}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-70px) scale(.55) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.35) rotate(-6deg)}70%{transform:scale(.94)}100%{transform:scale(1)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(13,13,13,.45)}70%,100%{box-shadow:0 0 0 22px rgba(13,13,13,0)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes spin{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
@keyframes shine{from{background-position:0 0}to{background-position:200% 0}}
@keyframes swing{0%,100%{transform:rotateY(-16deg) rotateZ(-1.2deg)}50%{transform:rotateY(16deg) rotateZ(1.2deg)}}
@keyframes roll{to{transform:translateX(-50%)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes nudgeL{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}
@keyframes nudgeR{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.in-page{animation:fade .55s ease backwards}
.in-logo{animation:drop 1.1s .1s cubic-bezier(.2,1.3,.4,1) backwards}
.enter{animation:ring 2.4s ease-out infinite,rise .8s .6s cubic-bezier(.2,.9,.3,1) backwards}
.rise-1{animation:rise .7s .15s cubic-bezier(.2,.9,.3,1) backwards}
.rise-2{animation:rise .7s .5s cubic-bezier(.2,.9,.3,1) backwards}
.rise-3{animation:rise .7s .75s cubic-bezier(.2,.9,.3,1) backwards}
.toast{animation:pop .35s ease-out}
.drawer{animation:slide .45s cubic-bezier(.2,.9,.3,1)}
.fadein{animation:fade .35s ease}
.line.new{animation:rise .5s cubic-bezier(.2,.9,.3,1) backwards}
.bumping{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
.pulse{animation:ring 1.6s .8s ease-out 2}

/* hover lift on the steel logos */
.hit{cursor:pointer;transition:transform .3s cubic-bezier(.3,1.6,.5,1),filter .3s}
.hit:hover{transform:translateY(-10px) scale(1.07);filter:drop-shadow(0 26px 22px rgba(0,0,0,.28))}
.hit:active{transform:scale(.97)}

/* social + phone */
.soc{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:999px;border:2px solid #0D0D0D;background:transparent;text-decoration:none;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s}
.soc:hover{background:#fff;transform:translateY(-3px) rotate(-8deg) scale(1.1)}
.soc:hover img,.soc:hover svg{animation:wig .5s ease}
.soc-lg{width:46px;height:46px}
.steel-x{font-family:'Unbounded',sans-serif;font-weight:900;font-size:18px;letter-spacing:.14em;background-image:linear-gradient(100deg,#F4F6F8 0%,#8E97A1 20%,#FBFCFD 35%,#4C545D 55%,#DCE1E6 75%,#F4F6F8 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
.steel-title{margin:0;font-family:'Unbounded',sans-serif;font-weight:900;text-transform:uppercase;font-size:clamp(40px,calc(9 * var(--vw,1vw)),112px);line-height:.95;letter-spacing:-.01em;text-wrap:balance;background-image:linear-gradient(100deg,#F4F6F8 0%,#8E97A1 14%,#FBFCFD 28%,#4C545D 46%,#DCE1E6 60%,#7D8690 78%,#F4F6F8 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #7D8690) drop-shadow(0 5px 0 #4C545D) drop-shadow(0 12px 16px rgba(0,0,0,.32));animation:rise .9s .15s cubic-bezier(.2,.9,.3,1) backwards,shine 4s linear infinite}

/* steel logo */
.persp{perspective:1600px;display:flex;justify-content:center}
.persp-sm{perspective:800px;display:flex;justify-content:center}
.tilt{transform-style:preserve-3d;transform:rotateX(-9deg)}
.logo3d{position:relative;width:clamp(260px,calc(62 * var(--vw,1vw)),640px);aspect-ratio:667/376;transform-style:preserve-3d;animation:spin 12s linear infinite}
.logo3d-sm{position:relative;width:clamp(120px,calc(15 * var(--vw,1vw)),180px);aspect-ratio:667/376;transform-style:preserve-3d;animation:spin 9s linear infinite}
.ly{position:absolute;inset:0;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.face{background-image:linear-gradient(90deg,#F4F6F8 0%,#8E97A1 14%,#FBFCFD 28%,#4C545D 46%,#DCE1E6 60%,#7D8690 78%,#F4F6F8 100%);background-size:200% 100%;background-repeat:repeat-x;animation:shine 5s linear infinite}
.floor{width:clamp(200px,calc(44 * var(--vw,1vw)),480px);height:34px;margin-top:-6px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.34),rgba(0,0,0,0) 70%);filter:blur(6px)}

/* shop wall */
.wall{--gap:clamp(10px,calc(4 * var(--vw,1vw)),72px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:var(--gap);row-gap:88px;width:100%;max-width:1120px;margin:0 auto;padding:0 28px}
.slot{position:relative;perspective:1300px;padding-top:30px;display:flex;justify-content:center;animation:rise .7s cubic-bezier(.2,.9,.3,1) backwards}
.slot:nth-child(1){animation-delay:.05s}.slot:nth-child(2){animation-delay:.15s}.slot:nth-child(3){animation-delay:.25s}.slot:nth-child(4){animation-delay:.35s}.slot:nth-child(5){animation-delay:.45s}.slot:nth-child(6){animation-delay:.55s}
.slot::before{content:"";position:absolute;top:36px;height:12px;left:calc(var(--gap) / -2);right:calc(var(--gap) / -2);background:linear-gradient(180deg,#FBFBFA 0%,#D2D2CD 28%,#80807B 68%,#BDBDB8 100%);box-shadow:0 10px 14px rgba(0,0,0,.22),inset 0 1px 0 #fff}
.slot:nth-child(3n+1)::before{left:-28px;border-radius:6px 0 0 6px}
.slot:nth-child(3n)::before{right:-28px;border-radius:0 6px 6px 0}
.slot:nth-child(3n+1)::after,.slot:nth-child(3n)::after{content:"";position:absolute;top:27px;width:16px;height:32px;border-radius:4px;background:linear-gradient(90deg,#7C7C78,#E2E2DE 45%,#8C8C88);box-shadow:0 4px 8px rgba(0,0,0,.25)}
.slot:nth-child(3n+1)::after{left:-28px}
.slot:nth-child(3n)::after{right:-28px}
.g{all:unset;box-sizing:border-box;position:relative;z-index:1;cursor:pointer;display:block;width:min(82%,290px);transform-origin:50% 6%;transform-style:preserve-3d;animation:swing 7s ease-in-out infinite}
.g svg{display:block;width:100%;height:auto;overflow:visible;transition:transform .35s ease,filter .35s ease;filter:drop-shadow(0 20px 14px rgba(0,0,0,.2));transform-origin:50% 8%}
.g:hover{animation-duration:2.6s}
.g:hover svg,.g:focus-visible svg{transform:scale(1.1) translateY(8px);filter:drop-shadow(0 26px 16px rgba(0,0,0,.32))}
.g:focus-visible{outline:3px solid #0D0D0D;outline-offset:8px}
.tag{position:absolute;left:50%;transform:translateX(-50%);bottom:-46px;opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none}
.g:hover .tag,.g:focus-visible .tag{opacity:1}
@media (hover:none){.tag{opacity:1}}

/* product: hanger, 3D garment, turn controls */
.stage{position:relative;width:min(100%,500px);height:min(560px,calc(95 * var(--vw,1vw)));perspective:1300px;margin:0 auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.rail{position:absolute;left:0;right:0;top:36px;height:12px;border-radius:6px;background:linear-gradient(180deg,#FBFBFA 0%,#D2D2CD 28%,#80807B 68%,#BDBDB8 100%);box-shadow:0 10px 14px rgba(0,0,0,.22),inset 0 1px 0 #fff}
.obj{position:absolute;left:50%;top:30px;width:clamp(240px,calc(34 * var(--vw,1vw)),400px);margin-left:calc(clamp(240px,calc(34 * var(--vw,1vw)),400px) / -2);aspect-ratio:200/300;transform-style:preserve-3d;will-change:transform}
.rot{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.face3d,.slice{position:absolute;inset:0;width:100%;height:100%;overflow:visible;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:block}
.slice{backface-visibility:visible;-webkit-backface-visibility:visible}
.face3d svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.hanger{position:absolute;left:50%;top:30px;width:clamp(240px,calc(34 * var(--vw,1vw)),400px);margin-left:calc(clamp(240px,calc(34 * var(--vw,1vw)),400px) / -2);aspect-ratio:200/300;pointer-events:none}
.hanger svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.shadow{position:absolute;left:50%;bottom:26px;width:46%;height:26px;margin-left:-23%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.4),rgba(0,0,0,0) 70%);filter:blur(7px);opacity:0}
.turnrow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.hint{display:inline-flex;align-items:center;gap:12px;min-height:44px;padding:0 20px;border:2px dashed #0D0D0D;border-radius:999px;background:rgba(255,255,255,.6)}
.hint .al{animation:nudgeL 1.1s ease-in-out infinite}
.hint .ar{animation:nudgeR 1.1s ease-in-out infinite}
.hint svg{display:block}
@media (prefers-reduced-motion:reduce){.hint .al,.hint .ar{animation:none}}

/* registration */
.reg{width:min(440px,100%);box-sizing:border-box;padding:26px 24px 24px;border:2px solid #0D0D0D;border-radius:26px;background:rgba(255,255,255,.62);display:flex;flex-direction:column;gap:16px;animation:rise .8s cubic-bezier(.2,.9,.3,1) backwards}
.fld{display:flex;flex-direction:column;gap:6px;animation:rise .6s cubic-bezier(.2,.9,.3,1) backwards}
.err{font-family:'Archivo',sans-serif;font-size:12px;font-weight:700;color:#B3261E;min-height:16px;line-height:1.3}
.chk{position:relative;display:block;flex:1 1 140px}
.chk input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.chip{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border:2px solid #0D0D0D;border-radius:999px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;transition:transform .22s cubic-bezier(.3,1.6,.5,1),background .2s,color .2s}
.chk:hover .chip{transform:translateY(-3px) scale(1.03)}
.chk input:checked + .chip{background:#0D0D0D;color:#F6F6F4}
.chk input:focus-visible + .chip{outline:3px solid #0D0D0D;outline-offset:3px}
.tick{width:18px;height:18px;border:2px solid currentColor;border-radius:6px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.tick path{stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s ease .05s}
.chk input:checked + .chip .tick path{stroke-dashoffset:0}
.draw-c{stroke-dasharray:140;stroke-dashoffset:140;animation:draw .7s .1s ease forwards}
.draw-t{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s .65s ease forwards}

.ticker{display:flex;width:max-content;animation:roll 28s linear infinite}


/* ===== responsive: phones and tablets ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
img,svg{max-width:100%}
@media (max-width:820px){
  .wall{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:76px;padding:0 16px}
  .slot::before{left:calc(var(--gap) / -2);right:calc(var(--gap) / -2)}
  .slot:nth-child(2n+1)::before{left:-16px;border-radius:6px 0 0 6px}
  .slot:nth-child(2n)::before{right:-16px;border-radius:0 6px 6px 0}
  .slot:nth-child(2n+1)::after{left:-16px}
  .slot:nth-child(2n)::after{right:-16px}
  .slot:nth-child(3n+1)::before,.slot:nth-child(3n)::before{left:calc(var(--gap) / -2);right:calc(var(--gap) / -2);border-radius:0}
  .slot:nth-child(3n+1)::after,.slot:nth-child(3n)::after{}
}
@media (max-width:520px){
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .pill{min-height:44px;padding:0 18px;font-size:11px;letter-spacing:.06em}
  .logo3d-sm{width:84px}
  .persp-sm{perspective:500px}

  function ping(a, t, f, vol, dec) {
    var ratios = [1, 2.756, 5.404, 8.933], vols = [1, 0.55, 0.3, 0.16];
    for (var i = 0; i < ratios.length; i++) {
      var o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.value = f * ratios[i];
      var d = dec / (1 + i * 0.7);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol * vols[i], t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(outNode); o.start(t); o.stop(t + d + 0.05);
    }
  }
  function noise(a, t, dur, vol, type, f0, f1) {
    var len = Math.max(1, Math.floor(a.sampleRate * dur));
    var buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);

    fl.frequency.setValueAtTime(f0, t);
    if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.02, dur / 3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(fl); fl.connect(g); g.connect(outNode); src.start(t); src.stop(t + dur + 0.02);

  function thump(a, t, f0, f1, vol, dur) {
    var o = a.createOscillator(), g = a.createGain();

      '<div style="display:flex;flex-direction:column;gap:12px"><h1 class="unb" style="margin:0;font-weight:900;text-transform:uppercase;font-size:clamp(30px,calc(4.4 * var(--vw,1vw)),54px);line-height:1.02;overflow-wrap:anywhere">' + esc(it.name) + '</h1>' +
      '<div class="lab" style="color:#4A4A46">' + esc(it.color) + ' · ' + money(it.num) + '</div></div>' +
      '<div style="display:flex;flex-direction:column;gap:2px;font-size:16px;font-weight:700;line-height:1.5"><span>' + esc(it.d1) + '</span><span>' + esc(it.d2) + '</span></div>' +
      '<div style="display:flex;flex-direction:column;gap:12px"><div class="lab">Size</div><div id="sizes" style="display:flex;flex-wrap:wrap;gap:10px">' + sizes + '</div>' +
      '<div><button class="pill" id="fit-toggle" data-act="fit-toggle" style="min-height:44px;padding:0 22px">' + (st.fitOpen ? 'Hide size finder' : 'Find my size') + '</button></div></div>' +
      '<div id="fit"' + (st.fitOpen ? '' : ' hidden') + ' style="display:flex;flex-direction:column;gap:14px;padding:20px;border:2px solid #0D0D0D;border-radius:22px;background:rgba(255,255,255,.55)">' +
      '<div style="display:flex;flex-wrap:wrap;gap:14px">' +
      '<div style="flex:1 1 130px;display:flex;flex-direction:column;gap:8px"><label for="fit-h" class="lab">Height (cm)</label><input id="fit-h" class="input" type="number" inputmode="numeric" placeholder="175"></div>' +
      '<div style="flex:1 1 130px;display:flex;flex-direction:column;gap:8px"><label for="fit-w" class="lab">Weight (kg)</label><input id="fit-w" class="input" type="number" inputmode="numeric" placeholder="70"></div></div>' +
      '<button class="pill pill-solid" data-act="fit-find" style="align-self:flex-start">Find my size</button>' +
      '<div id="fit-msg" role="status" class="unb" style="font-weight:700;font-size:14px;min-height:20px"></div></div>' +
      '<button class="pill pill-solid" data-act="add" style="align-self:flex-start;min-height:54px;padding:0 40px">Add to bag</button>' +
      '</div></div></section>';
  }

  /* ===== screen switching ===== */
  function show(screen) {
    st.screen = screen;
    if (screen !== 'product') stopSpin();
    var html = screen === 'intro' ? introHtml() : screen === 'soon' ? soonHtml() : screen === 'reg' ? regHtml()
      : screen === 'shop' ? shopHtml() : productHtml();
    $('app').innerHTML = html;
    window.scrollTo(0, 0);
    if (screen === 'product') startSpin();
  }
  function goEnter() { show(SHOP_OPEN ? 'shop' : 'soon'); }
  function goBackFromReg() { show(st.regFrom || 'intro'); }

  /* ===== product: hanger, spin, drag ===== */
  function paint() {
    var o = $('obj'), r = $('rot'), h = $('hanger'), s = $('shadow');
    if (!r) return;
    o.style.transform = 'translateY(' + spin.objY.toFixed(2) + 'px)';
    r.style.transform = 'rotateY(' + spin.ang.toFixed(2) + 'deg)';
    h.style.transform = 'translateY(' + (-spin.lift * 120).toFixed(2) + 'px)';
    h.style.opacity = Math.max(0, 1 - spin.lift * 1.25).toFixed(3);
    s.style.opacity = (spin.lift * 0.55).toFixed(3);
    s.style.transform = 'translateX(0) scale(' + (0.7 + 0.3 * spin.lift).toFixed(3) + ')';
    var hint = $('hint');
    if (hint) hint.textContent = spin.hangMode ? (spin.free0 ? 'Coming off the hanger…' : 'On the hanger') : 'Drag to spin';
  }
  function tick(now) {
    raf = 0;
    if (st.screen !== 'product') return;
    var dt = Math.min(2.5, (now - (spin.last || now)) / 16.67); spin.last = now;
    if (spin.free0 && now >= spin.free0) { spin.free0 = 0; spin.hangMode = false; spin.v = reduce ? 0 : 7; play('lift'); }
    if (spin.hangMode) {
      spin.lift += (0 - spin.lift) * 0.12 * dt;
      var sw = reduce ? 0 : 14 * Math.sin(now / 900);
      spin.ang += (sw - spin.ang) * 0.08 * dt;
      spin.objY += (0 - spin.objY) * 0.12 * dt;
    } else {
      spin.lift += (1 - spin.lift) * 0.06 * dt;
      var bob = reduce ? 0 : Math.sin(now / 650) * 6;
      spin.objY += (34 * spin.lift + bob * spin.lift - spin.objY) * 0.12 * dt;
      if (!spin.auto && !spin.dragging && spin.snapTo === null && spin.resumeAt && now >= spin.resumeAt) { spin.auto = true; spin.resumeAt = 0; }
      if (!spin.dragging) {
        if (spin.snapTo !== null) {
          spin.ang += (spin.snapTo - spin.ang) * 0.14 * dt;
          if (Math.abs(spin.snapTo - spin.ang) < 0.15) { spin.ang = spin.snapTo; spin.snapTo = null; spin.v = 0; }
        } else {
          var target = spin.auto ? 0.8 : 0;
          spin.v += (target - spin.v) * (spin.auto ? 0.03 : 0.045) * dt;
          spin.ang += spin.v * dt;
        }
      }
    }
    paint();
    raf = requestAnimationFrame(tick);
  }
  function startSpin() {
    spin.hangMode = true; spin.lift = 0; spin.ang = 0; spin.objY = 0; spin.v = 0; spin.snapTo = null;
    spin.dragging = false; spin.auto = !reduce; spin.free0 = performance.now() + 900; spin.resumeAt = 0; spin.last = performance.now();
    paint();
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function stopSpin() { if (raf) cancelAnimationFrame(raf); raf = 0; }
  function turn(step) {
    if (spin.hangMode) return;
    var base = spin.snapTo !== null ? spin.snapTo : spin.ang;
    spin.snapTo = Math.round(base / 45) * 45 + step;
    spin.auto = false; spin.v = 0; spin.resumeAt = performance.now() + 3500;
    play('turn');
  }

  /* ===== bag ===== */
  function renderToast() {
    var host = $('toast');
    var b = st.toastKey ? st.bag.filter(function (x) { return x.key === st.toastKey; })[0] : null;
    if (!b || st.bagOpen) { host.innerHTML = ''; return; }
    var it = byId(b.id);
    host.innerHTML = '<div role="status" class="toast toast-box" style="position:fixed;top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:40;display:flex;align-items:center;gap:16px;padding:14px 16px 14px 14px;background:#F6F6F4;border:2px solid #0D0D0D;border-radius:22px;box-shadow:0 18px 40px rgba(0,0,0,.25);max-width:calc(100% - 32px)">' +
      '<div style="display:flex;align-items:center;gap:14px;min-width:0">' + thumb(it, b.qty) +
      '<div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span class="unb" style="font-weight:700;font-size:13px;text-transform:uppercase">' + esc(it.name) + '</span><span class="lab" style="color:#4A4A46">Size ' + b.size + ' · Added</span></div></div>' +
      '<button class="pill pill-solid" data-act="bag-open" style="min-height:42px;padding:0 18px;flex:0 0 auto">View bag</button></div>';
  }
  function thumb(it, qty) {
    return '<div style="position:relative;width:68px;height:88px;flex:0 0 auto;background:#E3E5E8;border-radius:14px;display:flex;align-items:center;justify-content:center">' +
      plainGarment(it, 'style="width:54px;height:auto;display:block;overflow:visible" aria-hidden="true"') +
      '<span class="unb" style="position:absolute;right:-8px;top:-8px;background:#0D0D0D;color:#F6F6F4;font-weight:700;font-size:11px;line-height:1;padding:5px 8px;border-radius:999px">x' + qty + '</span></div>';
  }
  function bagListHtml(animate) {
    if (!st.bag.length) return '<div class="lab" style="color:#4A4A46;padding:24px 0">Your bag is empty</div>';
    var total = 0;
    var rows = st.bag.map(function (b) {
      var it = byId(b.id); total += it.num * b.qty;
      return '<div class="line' + (animate ? ' new' : '') + '" style="display:flex;gap:16px;align-items:flex-start;padding:18px 0;border-top:2px solid #0D0D0D">' + thumb(it, b.qty) +
        '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:12px">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><div style="display:flex;flex-direction:column;gap:4px"><span class="unb" style="font-weight:700;font-size:15px;text-transform:uppercase">' + esc(it.name) + '</span><span class="lab" style="color:#4A4A46">' + esc(it.color) + ' · ' + b.size + '</span></div><span class="unb" style="font-weight:700;font-size:15px">' + money(it.num * b.qty) + '</span></div>' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div style="display:flex;align-items:center;gap:12px">' +
        '<button class="qty" data-act="qty" data-k="' + b.key + '" data-d="-1" aria-label="One fewer ' + esc(it.name) + ' size ' + b.size + '">−</button>' +
        '<span class="unb" style="font-weight:700;font-size:14px;min-width:20px;text-align:center">' + b.qty + '</span>' +
        '<button class="qty" data-act="qty" data-k="' + b.key + '" data-d="1" aria-label="One more ' + esc(it.name) + ' size ' + b.size + '">+</button></div>' +
        '<button data-act="rm" data-k="' + b.key + '" aria-label="Remove ' + esc(it.name) + ' size ' + b.size + '" class="plain lab" style="text-decoration:underline;text-underline-offset:4px">Remove</button></div></div></div>';
    }).join('');
    return '<div>' + rows + '</div>' +
      '<div style="border-top:2px solid #0D0D0D;padding-top:18px;display:flex;flex-direction:column;gap:16px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="lab">Total</span><span class="unb" style="font-weight:900;font-size:24px">' + money(total) + '</span></div>' +
      '<button class="pill pill-solid" data-act="checkout" style="min-height:54px">Checkout</button><div role="status" style="font-size:14px;font-weight:700;min-height:20px">' + esc(st.note) + '</div></div>';
  }
  function openBag() {
    play('whoosh');
    st.bagOpen = true; st.toastKey = null; st.note = ''; renderToast();
    $('drawer').innerHTML = '<div style="position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end">' +
      '<button class="plain fadein" data-act="bag-close" aria-label="Close bag" style="flex:1;background:rgba(10,10,10,.42)"></button>' +
      '<aside class="drawer" role="dialog" aria-label="Bag" style="width:min(440px,100%);max-width:100%;height:100%;background:#F6F6F4;padding:max(24px,env(safe-area-inset-top,0px)) 24px 24px;display:flex;flex-direction:column;gap:20px;overflow-y:auto">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h2 class="unb" style="margin:0;font-weight:900;text-transform:uppercase;font-size:28px">Bag</h2><button class="pill" data-act="bag-close" style="min-height:44px;padding:0 22px">Close</button></div>' +
      '<div id="bag-body" style="display:flex;flex-direction:column;gap:20px">' + bagListHtml(true) + '</div></aside></div>';
  }
  function closeBag() { st.bagOpen = false; $('drawer').innerHTML = ''; }
  function refreshBag() {
    var n = bagCount();
    Array.prototype.forEach.call(document.querySelectorAll('.js-bag'), function (el) { el.textContent = 'Bag ' + n; });
    var body = $('bag-body'); if (body) body.innerHTML = bagListHtml(false);
  }
  function bump() {
    Array.prototype.forEach.call(document.querySelectorAll('.js-bag'), function (el) {
      el.classList.remove('bumping'); void el.offsetWidth; el.classList.add('bumping');
    });
    clearTimeout(bumpTimer);
    bumpTimer = setTimeout(function () {
      Array.prototype.forEach.call(document.querySelectorAll('.js-bag'), function (el) { el.classList.remove('bumping'); });
    }, 600);
  }
  function addToBag() {
    var it = items[st.sel], key = it.id + '|' + st.size;
    var f = st.bag.filter(function (b) { return b.key === key; })[0];
    if (f) f.qty += 1; else st.bag.push({ key: key, id: it.id, size: st.size, qty: 1 });
    st.toastKey = key; st.note = '';
    play('coin');
    refreshBag(); renderToast(); bump();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { st.toastKey = null; renderToast(); }, 3600);
  }
  function changeQty(key, d) {
    st.bag = st.bag.map(function (b) { if (b.key === key) b.qty += d; return b; }).filter(function (b) { return b.qty > 0; });
    st.note = ''; play('tick'); refreshBag();
  }
  function recommend(h, w) {
    var score = w + (h - 170) * 0.45;
    return score < 62 ? 'S' : score < 76 ? 'M' : score < 90 ? 'L' : 'XL';
  }
  function setSize(s) {
    st.size = s; play('tick');
    Array.prototype.forEach.call(document.querySelectorAll('#sizes .size'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-s') === s));
    });
  }

  /* ===== registration ===== */
  function validate() {
    var r = st.reg, err = {};
    var name = r.name.trim(), email = r.email.trim(), digits = r.phone.replace(/\D/g, '');
    if (name.length < 2) err.name = 'Enter your name.';
    if (digits.length !== 8) err.phone = 'Enter the 8 digits after ' + PHONE_CC + '.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) err.email = 'Enter a valid email.';
    if (!r.jog && !r.hood) err.items = 'Pick at least one.';
    r.err = err;
    return Object.keys(err).length === 0;
  }
  function cooldownLeft() {
    try { var t = +localStorage.getItem('exe_last_reg') || 0; return Math.max(0, COOLDOWN_MS - (Date.now() - t)); }
    catch (e) { return 0; }
  }
  function showFirstError() {
    var el = document.querySelector('#reg-form .err:not(:empty)');
    if (!el) return;
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    var f = el.parentElement && el.parentElement.querySelector('input');
    if (f) { try { f.focus({ preventScroll: true }); } catch (e) {} }
  }
  function submitReg() {
    var r = st.reg;
    if (r.status === 'sending') return;
    var left = cooldownLeft();
    if (left > 0) { r.note = 'Please wait ' + Math.ceil(left / 1000) + ' seconds before registering again.'; show(st.screen); showFirstError(); return; }
    if (!validate()) { r.status = 'idle'; r.note = ''; show(st.screen); showFirstError(); return; }
    r.note = ''; r.status = 'sending'; show(st.screen);
    try { localStorage.setItem('exe_last_reg', String(Date.now())); } catch (e) {}
    var items2 = []; if (r.jog) items2.push('Jogger'); if (r.hood) items2.push('Hoodie');
    var digits = r.phone.replace(/\D/g, '');
    var body = JSON.stringify({
      username: 'عxع',
      allowed_mentions: { parse: [] },
      embeds: [{
        title: 'New signup',
        color: 2829099,
        fields: [
          { name: 'Name', value: r.name.trim().slice(0, 100), inline: true },
          { name: 'Phone', value: PHONE_CC + ' ' + digits, inline: true },
          { name: 'Email', value: r.email.trim().slice(0, 200), inline: false },
          { name: 'Wants', value: items2.join(' + ').slice(0, 200), inline: false }
        ],
        footer: { text: 'عxع' },
        timestamp: new Date().toISOString()
      }]
    });
    fetch(hookUrl(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body })
      .then(function (res) {
        return res.text().then(function (txt) { return { res: res, txt: txt }; });
      })
      .then(function (o) {
        if (o.res.ok) {
          r.status = 'sent'; r.note = ''; r.first = r.name.trim().split(/\s+/)[0] || '';
        } else {
          try { localStorage.removeItem('exe_last_reg'); } catch (e) {}
          r.status = 'error'; r.note = describeFailure(o.res.status, o.txt);
        }
        show(st.screen); if (r.status === 'error') showFirstError();
      })
      .catch(function (err) {
        try { localStorage.removeItem('exe_last_reg'); } catch (e) {}
        r.status = 'error';
        r.note = 'Not sent: the browser could not reach Discord (' + ((err && err.message) || 'network error') + '). Check your internet connection, turn off ad blockers or privacy extensions for this page, and try again.';
        show(st.screen); showFirstError();
      });
  }
  function describeFailure(code, txt) {
    var msg = '';
    try { msg = (JSON.parse(txt).message || '').toString(); } catch (e) { msg = (txt || '').slice(0, 160); }
    if (code === 401 || code === 404) return 'Not sent: the Discord webhook was not found or was deleted (error ' + code + '). Create a new webhook in Discord and update the file.';
    if (code === 429) return 'Not sent: Discord is rate-limiting this webhook right now. Wait a minute and try again.';
    if (code >= 500) return 'Not sent: Discord had a server problem (error ' + code + '). Try again in a moment.';
    if (code === 400) return 'Not sent: Discord rejected the message (' + (msg || 'bad request') + ').';
    return 'Not sent: Discord answered with error ' + code + (msg ? ' (' + msg + ')' : '') + '.';
  }

  /* ===== fit to the phone screen =====
     Some browsers and preview windows draw the page at desktop width (about 980px)
     and shrink it. If the page is wider than the device screen, scale the root so
     it fills the screen like a normal mobile site. On phones with a normal viewport
     the factor is 1 and nothing changes. */
  function fitToScreen() {
    var root = document.documentElement;
    var sw = (window.screen && screen.width) || 0;
    var sh = (window.screen && screen.height) || 0;
    var iw = window.innerWidth || root.clientWidth || 0;
    var on = !!sw && iw > sw + 4;
    if (on) {
      root.style.width = sw + 'px';
      root.style.zoom = String(iw / sw);
      root.style.setProperty('--vw', (sw / 100) + 'px');
      root.style.setProperty('--vh', sh + 'px');
    } else {
      root.style.width = ''; root.style.zoom = '';
      root.style.removeProperty('--vw'); root.style.removeProperty('--vh');
    }
    root.classList.toggle('fit', on);
    root.classList.toggle('xs', on && sw <= 360);
  }
  fitToScreen();
  window.addEventListener('resize', fitToScreen);
  window.addEventListener('orientationchange', fitToScreen);

  /* ===== events ===== */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var a = t.getAttribute('data-act');
    if (a === 'family') { e.preventDefault(); return; }
    if (a === 'enter') goEnter();
    else if (a === 'home') show('intro');
    else if (a === 'back') show('shop');
    else if (a === 'reg-from-intro') { st.regFrom = 'intro'; if (st.reg.status === 'sent') st.reg.status = 'idle'; show('reg'); }
    else if (a === 'reg-from-soon') { st.regFrom = 'soon'; if (st.reg.status === 'sent') st.reg.status = 'idle'; show('reg'); }
    else if (a === 'reg-back') goBackFromReg();
    else if (a === 'open') { st.sel = +t.getAttribute('data-i'); closeBag(); play('whoosh'); show('product'); }
    else if (a === 'size') setSize(t.getAttribute('data-s'));
    else if (a === 'turn') turn(+t.getAttribute('data-d'));
    else if (a === 'fit-toggle') {
      st.fitOpen = !st.fitOpen; $('fit').hidden = !st.fitOpen;
      t.textContent = st.fitOpen ? 'Hide size finder' : 'Find my size';
    }
    else if (a === 'fit-find') {
      var h = parseFloat($('fit-h').value), w = parseFloat($('fit-w').value), msg = $('fit-msg');
      if (!(h >= 120 && h <= 230) || !(w >= 30 && w <= 200)) { msg.textContent = 'Enter height 120 to 230 cm and weight 30 to 200 kg.'; return; }
      var s = recommend(h, w); setSize(s); msg.textContent = 'Your size: ' + s;
    }
    else if (a === 'add') addToBag();
    else if (a === 'bag-open') openBag();
    else if (a === 'bag-close') { play('tick'); closeBag(); }
    else if (a === 'qty') changeQty(t.getAttribute('data-k'), +t.getAttribute('data-d'));
    else if (a === 'rm') { play('remove'); st.bag = st.bag.filter(function (b) { return b.key !== t.getAttribute('data-k'); }); st.note = ''; refreshBag(); }
    else if (a === 'checkout') { st.note = 'Payments are not connected yet.'; refreshBag(); }
    else if (a === 'continue') show('shop');
  });
  document.addEventListener('mouseover', function (e) {
    var g = e.target.closest && e.target.closest('.g');
    if (g && !g.contains(e.relatedTarget)) play('clink');
  });
  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'reg-name') st.reg.name = e.target.value;
    else if (id === 'reg-email') st.reg.email = e.target.value;
    else if (id === 'reg-phone') { var d = e.target.value.replace(/\D/g, '').slice(0, 8); e.target.value = d; st.reg.phone = d; }
  });
  document.addEventListener('change', function (e) {
    var c = e.target.getAttribute && e.target.getAttribute('data-chk');
    if (c === 'jog') st.reg.jog = e.target.checked;
    if (c === 'hood') st.reg.hood = e.target.checked;
  });
  document.addEventListener('submit', function (e) {
    if (e.target && e.target.id === 'reg-form') { e.preventDefault(); submitReg(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && st.bagOpen) { closeBag(); } });

  /* drag to spin on the product stage */
  document.addEventListener('pointerdown', function (e) {
    var s = e.target.closest && e.target.closest('#stage');
    if (!s || spin.hangMode) return;
    spin.dragging = true; spin.lastX = e.clientX; spin.v = 0; spin.snapTo = null; spin.auto = false;
    try { s.setPointerCapture(e.pointerId); } catch (err) {}
  });
  document.addEventListener('pointermove', function (e) {
    if (!spin.dragging) return;
    var dx = e.clientX - spin.lastX; spin.lastX = e.clientX;
    spin.ang += dx * 0.55; spin.v = spin.v * 0.5 + dx * 0.275;
  });
  function endDrag() { if (!spin.dragging) return; spin.dragging = false; spin.resumeAt = performance.now() + 3500; }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);

  show('intro');
})();
</script>
